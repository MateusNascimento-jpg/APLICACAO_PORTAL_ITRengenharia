<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Diretor — ITR Engenharia</title>
<link rel="icon" href="IMG/logo.png">
<!-- Ícones: SVG inline (sem dependência de rede/CDN). Convertidos no carregamento. -->
<style id="ti-fallback">.ti{ display:inline-flex; align-items:center; justify-content:center; vertical-align:-0.15em; }
.ti svg{ width:1em; height:1em; }</style>
<style>
  /* ===== Mesmo tema do portal.html (paleta Midnight continua CONGELADA) ===== */
  :root{
    --bg:#2b2e31;
    --bg-deep:#26282b;
    --card:rgba(38,41,45,0.72);
    --card-2:rgba(46,50,55,0.78);
    --line:rgba(150,170,195,0.30);
    --line-soft:rgba(150,170,195,0.16);
    --azul:#3d7be0;
    --azul-claro:#7ba2e6;
    --azul-link:#8fb6ec;
    --txt:#f3f5f8;
    --txt-2:#c9cdd4;
    --txt-3:#8b97a8;
    --txt-4:#727d8a;
    --field:rgba(18,20,23,0.55);
    --verde-bg:rgba(45,120,80,0.22);
    --verde-bd:rgba(90,200,140,0.40);
    --verde-tx:#7fd6a4;
    --amarelo-bg:rgba(120,100,40,0.22);
    --amarelo-bd:rgba(210,180,90,0.38);
    --amarelo-tx:#e0c074;
    --cinza-bg:rgba(120,130,145,0.16);
    --cinza-tx:#9aa6b6;
    --erro-bg:rgba(180,50,50,0.16);
    --erro-bd:rgba(220,90,90,0.40);
    --erro-tx:#f3a4a4;
    --logo-filtro:none;
    --grade-forte:rgba(120,140,165,0.13);
    --grade-fraca:rgba(110,128,150,0.055);
    --vinheta-1:rgba(43,46,49,0); --vinheta-2:rgba(38,40,43,0.30); --vinheta-3:rgba(30,32,34,0.72);
  }
  [data-tema="claro"]{
    --bg:#eef1f5;
    --bg-deep:#e4e8ee;
    --card:rgba(255,255,255,0.82);
    --card-2:rgba(255,255,255,0.92);
    --line:rgba(60,90,130,0.22);
    --line-soft:rgba(60,90,130,0.12);
    --azul:#2f6bd0;
    --azul-claro:#2f6bd0;
    --azul-link:#2a5fbe;
    --txt:#1d2733;
    --txt-2:#3a4856;
    --txt-3:#67748a;
    --txt-4:#8a96a8;
    --field:rgba(255,255,255,0.9);
    --verde-bg:rgba(40,150,95,0.14);
    --verde-bd:rgba(40,150,95,0.40);
    --verde-tx:#1f8a55;
    --amarelo-bg:rgba(180,140,30,0.16);
    --amarelo-bd:rgba(180,140,30,0.40);
    --amarelo-tx:#9a7510;
    --cinza-bg:rgba(90,105,125,0.12);
    --cinza-tx:#5a677a;
    --erro-bg:rgba(200,60,60,0.12);
    --erro-bd:rgba(200,60,60,0.40);
    --erro-tx:#b23b3b;
    --logo-filtro:invert(1) brightness(0.25);
    --grade-forte:rgba(60,90,130,0.10);
    --grade-fraca:rgba(60,90,130,0.045);
    --vinheta-1:rgba(238,241,245,0); --vinheta-2:rgba(225,230,238,0.30); --vinheta-3:rgba(210,218,228,0.55);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ min-height:100%; }
  body{
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--txt);
    min-height:100vh;
    position:relative;
    padding:0 0 60px;
    transition:background .4s ease, color .4s ease;
  }

  /* ===== Fundo: blueprint estático + vinheta (igual ao portal) ===== */
  #campo{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  #vinheta{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%,
        var(--vinheta-1) 0%,
        var(--vinheta-2) 60%,
        var(--vinheta-3) 100%);
    transition:background .4s ease;
  }
  .conteudo{ position:relative; z-index:3; max-width:1080px; margin:0 auto; padding:0 1.4rem; }

  /* ===== Cabeçalho ===== */
  .topo{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.4rem 0 1.1rem; gap:1rem; flex-wrap:wrap;
    border-bottom:1px solid var(--line-soft);
    margin-bottom:1.4rem;
  }
  .topo .logo-link{ display:inline-flex; align-items:center; }
  .topo .logo-link img{ width:148px; height:auto; filter:var(--logo-filtro); transition:filter .4s ease; }
  .btn-sair{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--field); color:var(--txt-2);
    border:0.5px solid var(--line-soft); border-radius:10px;
    padding:9px 15px; font-size:13.5px; font-family:inherit; cursor:pointer;
    transition:border-color .2s, color .2s, transform .15s, background .2s;
  }
  .btn-sair i{ font-size:17px; transition:transform .25s; }
  .btn-sair:hover{ color:var(--txt); border-color:rgba(123,162,230,0.55); background:rgba(18,20,23,0.7); }
  .btn-sair:hover i{ transform:translateX(2px); }
  .btn-tema{
    width:42px; height:40px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--field); color:var(--azul-claro);
    border:0.5px solid var(--line-soft); border-radius:10px; cursor:pointer;
    font-family:inherit; transition:border-color .2s, color .2s, background .2s, transform .15s;
  }
  .btn-tema svg{ width:19px; height:19px; transition:transform .4s ease; }
  .btn-tema:hover{ border-color:rgba(123,162,230,0.55); transform:translateY(-1px); }
  .btn-tema:hover svg{ transform:rotate(40deg); }

  .titulo-painel{ margin:2px 0 18px; }
  .titulo-painel h1{
    font-size:27px; font-weight:800; letter-spacing:.2px; color:var(--txt);
  }
  .titulo-painel .sub{ color:var(--txt-3); font-size:13.5px; margin-top:10px; }

  /* ===== Abas do painel (Clientes / Downloads) ===== */
  .abas-painel{ display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--line-soft); }
  .aba-painel{
    background:transparent; border:none; border-bottom:2px solid transparent;
    color:var(--txt-3); font-family:inherit; font-size:13.5px; font-weight:600;
    padding:10px 4px; margin-bottom:-1px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
    transition:color .2s, border-color .2s;
  }
  .aba-painel i{ font-size:16px; }
  .aba-painel:hover{ color:var(--txt); }
  .aba-painel.ativa{ color:var(--azul-claro); border-bottom-color:var(--azul); }

  /* ===== Estado de checagem de sessão (guard) ===== */
  .guard{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:90px 20px; color:var(--txt-3); font-size:14px;
  }
  .guard i{ font-size:26px; color:var(--azul-claro); animation:girar 1s linear infinite; }
  @keyframes girar{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .guard i{ animation:none; } }

  /* ===== Busca (mesmo estilo da página inicial/portal.html) ===== */
  .busca{
    flex:1; min-width:220px; display:flex; align-items:center;
    background:var(--field); border:0.5px solid var(--line-soft); border-radius:11px;
    padding:0 13px; height:46px; margin-bottom:16px;
    transition:border-color .25s, box-shadow .25s, background .25s;
  }
  .busca:focus-within{ border-color:rgba(123,162,230,0.65); box-shadow:0 0 0 3px rgba(61,123,224,0.16); }
  .busca i{ color:var(--azul-claro); font-size:18px; margin-right:9px; }
  .busca input{ flex:1; background:transparent; border:none; outline:none; color:var(--txt); font-size:14px; font-family:inherit; }
  .busca input::placeholder{ color:var(--txt-4); }

  /* ===== Bolhas de clientes ===== */
  .contagem-clientes{ color:var(--txt-3); font-size:12.5px; margin-bottom:14px; }
  .bolhas{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px;
  }
  .bolha{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
    background:var(--card); border:0.5px solid var(--line); border-radius:14px;
    padding:20px 14px; cursor:pointer; font-family:inherit;
    backdrop-filter:blur(11px) saturate(115%); -webkit-backdrop-filter:blur(11px) saturate(115%);
    box-shadow:0 8px 20px rgba(0,0,0,0.20);
    transition:transform .2s, border-color .2s, box-shadow .2s;
  }
  .bolha:hover{ transform:translateY(-3px); border-color:rgba(123,162,230,0.45); box-shadow:0 16px 34px rgba(0,0,0,0.30); }
  .bolha .ico{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(61,123,224,0.16); color:var(--azul-claro); font-size:20px;
  }
  .bolha .nome{ color:var(--txt); font-size:13.5px; font-weight:600; line-height:1.3; }

  /* ===== Lista de trabalhos do cliente selecionado ===== */
  .barra-cliente{ display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .btn-voltar{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--field); color:var(--txt-2);
    border:0.5px solid var(--line-soft); border-radius:10px;
    padding:8px 14px; font-size:13px; font-family:inherit; cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  .btn-voltar:hover{ color:var(--txt); border-color:rgba(123,162,230,0.55); }
  .nome-cliente-atual{ font-size:18px; font-weight:600; color:var(--txt); }

  .lista-trabalhos{ display:flex; flex-direction:column; gap:12px; }
  .trabalho{
    background:var(--card); border:0.5px solid var(--line); border-radius:14px;
    padding:15px 18px; display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap;
    backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px);
  }
  .trabalho .info{ min-width:0; }
  .trabalho .id-trabalho{ color:var(--txt); font-size:14px; font-weight:600; }
  .trabalho .os{ color:var(--txt-3); font-size:12.5px; margin-top:3px; }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    border-radius:20px; padding:5px 12px; font-size:12px; font-weight:600; white-space:nowrap;
  }
  .badge.aprovado{ background:var(--verde-bg); border:1px solid var(--verde-bd); color:var(--verde-tx); }
  .badge.refazer{ background:var(--erro-bg); border:1px solid var(--erro-bd); color:var(--erro-tx); }
  .badge.andamento{ background:var(--amarelo-bg); border:1px solid var(--amarelo-bd); color:var(--amarelo-tx); }
  .badge.indefinido{ background:var(--cinza-bg); border:1px solid var(--line-soft); color:var(--cinza-tx); }

  /* ===== Selo de download (Fase 6) ===== */
  .selo-download{
    display:inline-flex; align-items:center; gap:5px;
    border-radius:20px; padding:4px 11px; font-size:11.5px; font-weight:600; white-space:nowrap;
  }
  .selo-download.baixado{ background:var(--verde-bg); border:1px solid var(--verde-bd); color:var(--verde-tx); }
  .selo-download.nao-baixado{ background:var(--cinza-bg); border:1px solid var(--line-soft); color:var(--cinza-tx); }
  .selo-download i{ font-size:13px; }

  /* ===== Visão 3: histórico de downloads (Fase 7) ===== */
  .contagem-downloads{ color:var(--txt-3); font-size:12.5px; margin-bottom:14px; }
  .lista-downloads{ display:flex; flex-direction:column; gap:10px; }
  .download-row{
    display:grid; grid-template-columns:1.2fr 2fr 1fr; align-items:center; gap:14px;
    background:var(--card); border:0.5px solid var(--line); border-radius:12px;
    padding:13px 16px;
    backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px);
  }
  .download-row .dl-empresa{ display:flex; }
  .chip-empresa{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(61,123,224,0.14); border:1px solid var(--line-soft); border-radius:20px;
    padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--txt); white-space:nowrap;
  }
  .chip-empresa i{ font-size:14px; color:var(--azul-claro); flex-shrink:0; }
  .download-row .dl-relatorio{ color:var(--txt-2); font-size:12.5px; }
  .download-row .dl-relatorio .dl-os{ color:var(--azul-claro); font-weight:600; margin-right:6px; }
  .download-row .dl-data{ color:var(--txt-3); font-size:12px; text-align:right; white-space:nowrap; }
  @media (max-width:640px){
    .download-row{ grid-template-columns:1fr; gap:4px; }
    .download-row .dl-data{ text-align:left; }
  }

  .msg-vazio{ color:var(--txt-3); font-size:13.5px; padding:30px 0; text-align:center; }

  /* ===== Ações de aprovação (três estados) ===== */
  .acoes-aprovacao{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn-aprovacao{
    display:inline-flex; align-items:center; gap:5px;
    border-radius:9px; padding:7px 12px; font-size:12px; font-weight:600; font-family:inherit;
    cursor:pointer; background:var(--field); color:var(--txt-2);
    border:0.5px solid var(--line-soft);
    transition:border-color .2s, color .2s, background .2s, opacity .2s;
  }
  .btn-aprovacao:hover{ color:var(--txt); border-color:rgba(123,162,230,0.55); }
  .btn-aprovacao.aprovado:hover{ border-color:var(--verde-bd); color:var(--verde-tx); background:var(--verde-bg); }
  .btn-aprovacao.refazer:hover{ border-color:var(--erro-bd); color:var(--erro-tx); background:var(--erro-bg); }
  .btn-aprovacao.andamento:hover{ border-color:var(--amarelo-bd); color:var(--amarelo-tx); background:var(--amarelo-bg); }
  .btn-aprovacao.ativo.aprovado{ border-color:var(--verde-bd); color:var(--verde-tx); background:var(--verde-bg); }
  .btn-aprovacao.ativo.refazer{ border-color:var(--erro-bd); color:var(--erro-tx); background:var(--erro-bg); }
  .btn-aprovacao.ativo.andamento{ border-color:var(--amarelo-bd); color:var(--amarelo-tx); background:var(--amarelo-bg); }
  .btn-aprovacao[disabled]{ opacity:.5; cursor:default; pointer-events:none; }
  .trabalho .cab-trabalho{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; width:100%; }

  /* ===== Toast simples de feedback ===== */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--card-2); border:0.5px solid var(--line); color:var(--txt);
    padding:12px 20px; border-radius:11px; font-size:13.5px; z-index:50;
    box-shadow:0 14px 32px rgba(0,0,0,0.30); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px);
  }
  #toast.ver{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.erro{ border-color:var(--erro-bd); color:var(--erro-tx); }

  @media (max-width:720px){
    .topo .logo-link img{ width:124px; }
    .titulo-painel h1{ font-size:20px; }
  }
</style>
</head>
<body>
<canvas id="campo" aria-hidden="true"></canvas>
<div id="vinheta" aria-hidden="true"></div>

<div class="conteudo">

  <!-- Cabeçalho -->
  <header class="topo">
    <span class="logo-link" aria-label="ITR Engenharia">
      <img src="IMG/logo.png" alt="ITR Engenharia">
    </span>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn-tema" id="btnTema" aria-label="Alternar tema claro ou escuro" title="Alternar tema">
        <svg id="iconeTema" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M3 12h1M20 12h1M12 3v1M12 20v1M5.6 5.6l.7 .7M17.7 17.7l.7 .7M18.4 5.6l-.7 .7M6.3 17.7l-.7 .7"/></svg>
      </button>
      <button class="btn-sair" id="btnSair">Sair <i class="ti ti-logout" aria-hidden="true"></i></button>
    </div>
  </header>

  <div class="titulo-painel">
    <h1>Painel do Diretor</h1>
    <div class="sub">Clientes, trabalhos e downloads em um só lugar.</div>
  </div>

  <!-- Conteúdo do painel -->
  <div id="conteudoPainel">
    <div class="guard" id="guard">
      <i class="ti ti-loader-2" aria-hidden="true"></i>
      <span>Verificando sessão...</span>
    </div>

    <!-- Abas: Clientes / Downloads -->
    <nav class="abas-painel" id="abasPainel" style="display:none">
      <button class="aba-painel ativa" id="abaClientes" data-aba="clientes"><i class="ti ti-building" aria-hidden="true"></i>Clientes</button>
      <button class="aba-painel" id="abaDownloads" data-aba="downloads"><i class="ti ti-download" aria-hidden="true"></i>Downloads</button>
    </nav>

    <!-- Visão 1: bolhas de clientes -->
    <div id="visaoClientes" style="display:none">
      <div class="busca">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="buscaClientes" placeholder="Buscar cliente..." aria-label="Buscar cliente">
      </div>
      <div class="contagem-clientes" id="contagemClientes"></div>
      <div class="bolhas" id="bolhas"></div>
    </div>

    <!-- Visão 2: trabalhos do cliente selecionado -->
    <div id="visaoTrabalhos" style="display:none">
      <div class="barra-cliente">
        <button class="btn-voltar" id="btnVoltarClientes"><i class="ti ti-arrow-left" aria-hidden="true"></i>Clientes</button>
        <span class="nome-cliente-atual" id="nomeClienteAtual"></span>
      </div>
      <div class="busca">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="buscaTrabalhos" placeholder="Buscar por ID do trabalho, OS ou status..." aria-label="Buscar trabalho">
      </div>
      <div class="lista-trabalhos" id="listaTrabalhos"></div>
    </div>

    <!-- Visão 3: histórico completo de downloads -->
    <div id="visaoDownloads" style="display:none">
      <div class="busca">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="buscaDownloads" placeholder="Buscar por empresa ou OS..." aria-label="Buscar download">
      </div>
      <div class="contagem-downloads" id="contagemDownloads"></div>
      <div class="lista-downloads" id="listaDownloads"></div>
    </div>
  </div>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================================
   ÍCONES SVG INLINE (mesmo esquema do portal.html — sem CDN)
   ========================================================================= */
var TI_SVG = {
  'loader-2':'<path d="M12 3a9 9 0 1 0 9 9"/>',
  'logout':'<path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/><path d="M9 12h12l-3 -3"/><path d="M18 15l3 -3"/>',
  'building':'<path d="M3 21l18 0"/><path d="M9 8l1 0"/><path d="M9 12l1 0"/><path d="M9 16l1 0"/><path d="M14 8l1 0"/><path d="M14 12l1 0"/><path d="M14 16l1 0"/><path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16"/>',
  'arrow-left':'<path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/>',
  'search':'<circle cx="10" cy="10" r="7"/><path d="M21 21l-6 -6"/>',
  'check':'<path d="M5 12l5 5l10 -10"/>',
  'download':'<path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4l0 12"/>'
};
function svgIcone(nome){
  var corpo = TI_SVG[nome];
  if(!corpo) return '';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+corpo+'</svg>';
}
function aplicarIcones(raiz){
  (raiz||document).querySelectorAll('i.ti').forEach(function(el){
    if(el.getAttribute('data-svg-ok')) return;
    var nome = '';
    el.classList.forEach(function(c){ if(c.indexOf('ti-')===0) nome=c.slice(3); });
    var svg = svgIcone(nome);
    if(svg){ el.innerHTML = svg; el.setAttribute('data-svg-ok','1'); }
  });
}
if(document.readyState!=='loading') aplicarIcones();
else document.addEventListener('DOMContentLoaded', function(){ aplicarIcones(); });

/* ---- Blueprint estático de fundo (idêntico ao portal.html) ---- */
(function(){
  var cv = document.getElementById('campo');
  var ctx = cv.getContext('2d');
  var passo = 40;
  function desenhar(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = window.innerWidth, H = Math.max(window.innerHeight, document.body.scrollHeight);
    cv.width = W*dpr; cv.height = H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    var cs = getComputedStyle(document.documentElement);
    var forte = (cs.getPropertyValue('--grade-forte')||'rgba(120,140,165,0.13)').trim();
    var fraca = (cs.getPropertyValue('--grade-fraca')||'rgba(110,128,150,0.055)').trim();
    ctx.lineWidth = 0.5;
    for(var x=0;x<=W;x+=passo){ ctx.strokeStyle=(x%(passo*5)===0)?forte:fraca; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(var y=0;y<=H;y+=passo){ ctx.strokeStyle=(y%(passo*5)===0)?forte:fraca; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  }
  desenhar();
  window.addEventListener('resize', desenhar);
  window._redesenharFundo = desenhar;
})();

/* ---- Alternar tema claro/escuro (igual ao portal.html) ---- */
var SVG_SOL = '<circle cx="12" cy="12" r="4"/><path d="M3 12h1M20 12h1M12 3v1M12 20v1M5.6 5.6l.7 .7M17.7 17.7l.7 .7M18.4 5.6l-.7 .7M6.3 17.7l-.7 .7"/>';
var SVG_LUA = '<path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/>';
document.getElementById('btnTema').addEventListener('click', function(){
  var raiz = document.documentElement;
  var claro = raiz.getAttribute('data-tema') === 'claro';
  var icone = document.getElementById('iconeTema');
  if(claro){ raiz.removeAttribute('data-tema'); icone.innerHTML = SVG_SOL; }
  else { raiz.setAttribute('data-tema','claro'); icone.innerHTML = SVG_LUA; }
  if(window._redesenharFundo) setTimeout(window._redesenharFundo, 60);
});

/* ---- Sair: limpa token e volta ao login ---- */
document.getElementById('btnSair').addEventListener('click', function(){
  try { localStorage.removeItem('token'); sessionStorage.removeItem('token'); } catch(e){}
  window.location.href = 'login.html';
});

/* =========================================================================
   GUARD DE SESSÃO: só o Diretor acessa este painel.
   Sem token OU perfil != 'Diretor' OU token inválido -> volta pro login.
   ========================================================================= */
function pegarToken(){
  try { return localStorage.getItem('token') || sessionStorage.getItem('token'); } catch(e){ return null; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function normalizar(s){ return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }

async function verificarSessaoDiretor(){
  var token = pegarToken();
  if(!token){ window.location.href = 'login.html'; return; }

  try {
    var resp = await fetch('/api/perfil', { headers: { 'Authorization': 'Bearer ' + token } });
    if(resp.status === 401 || resp.status === 403){ window.location.href = 'login.html'; return; }
    if(!resp.ok) throw new Error('Falha ao verificar sessão');
    var dados = await resp.json();
    var perfil = dados && dados.usuario && dados.usuario.perfil;
    if(perfil !== 'Diretor'){ window.location.href = 'login.html'; return; }

    document.getElementById('guard').remove();
    document.getElementById('abasPainel').style.display = '';
    document.getElementById('visaoClientes').style.display = '';
    carregarClientes();
  } catch(e){
    window.location.href = 'login.html';
  }
}
verificarSessaoDiretor();

/* =========================================================================
   VISÃO 1: bolhas de clientes (GET /api/diretor/clientes)
   ========================================================================= */
var TODOS_CLIENTES = []; // cache em memória: a busca filtra local, sem refetch

function renderBolhas(clientes){
  var box = document.getElementById('bolhas');
  var contagem = document.getElementById('contagemClientes');
  contagem.textContent = clientes.length + ' cliente' + (clientes.length === 1 ? '' : 's');
  if(clientes.length === 0){
    box.innerHTML = '<div class="msg-vazio">Nenhum cliente encontrado.</div>';
    return;
  }
  box.innerHTML = clientes.map(function(c){
    return '<button class="bolha" data-id="'+esc(c.id)+'" data-nome="'+esc(c.nome)+'" data-cnpj="'+esc(c.cnpj||'')+'">'
      + '<span class="ico"><i class="ti ti-building" aria-hidden="true"></i></span>'
      + '<span class="nome">'+esc(c.nome)+'</span>'
      + '</button>';
  }).join('');
  aplicarIcones(box);
  box.querySelectorAll('.bolha').forEach(function(b){
    b.addEventListener('click', function(){
      abrirTrabalhosCliente(this.getAttribute('data-id'), this.getAttribute('data-nome'), this.getAttribute('data-cnpj'));
    });
  });
}

async function carregarClientes(){
  var box = document.getElementById('bolhas');
  var contagem = document.getElementById('contagemClientes');
  box.innerHTML = '';
  contagem.textContent = 'Carregando clientes...';
  try {
    var resp = await fetch('/api/diretor/clientes', { headers: { 'Authorization': 'Bearer ' + pegarToken() } });
    if(resp.status === 401 || resp.status === 403){ window.location.href = 'login.html'; return; }
    var dados = await resp.json();
    if(!dados.sucesso) throw new Error(dados.erro || 'Falha ao carregar clientes');
    TODOS_CLIENTES = dados.clientes || [];
    renderBolhas(TODOS_CLIENTES);
  } catch(e){
    contagem.textContent = '';
    box.innerHTML = '<div class="msg-vazio">Não foi possível carregar os clientes. Tente recarregar a página.</div>';
  }
}

document.getElementById('buscaClientes').addEventListener('input', function(){
  var termo = normalizar(this.value);
  if(!termo){ renderBolhas(TODOS_CLIENTES); return; }
  renderBolhas(TODOS_CLIENTES.filter(function(c){ return normalizar(c.nome).indexOf(termo) !== -1; }));
});

/* =========================================================================
   VISÃO 2: trabalhos do cliente selecionado (GET /api/diretor/trabalhos/:id)
   ========================================================================= */
var ROTULO_APROVACAO = {
  'Aprovado': { classe:'aprovado', texto:'Aprovado' },
  'Refazer': { classe:'refazer', texto:'Refazer' },
  'Em Andamento': { classe:'andamento', texto:'Em Andamento' }
};
function badgeAprovacao(valor){
  var info = ROTULO_APROVACAO[valor] || { classe:'indefinido', texto: valor || 'Sem aprovação definida' };
  return '<span class="badge '+info.classe+'">'+esc(info.texto)+'</span>';
}

var TRABALHOS_ATUAIS = []; // cache do cliente aberto no momento (busca filtra local)
var CNPJ_ATUAL = null;     // CNPJ do cliente aberto (para cruzar com /api/diretor/downloads)
var MAPA_DOWNLOADS_ATUAL = {}; // record_id -> baixado_em, so' do cliente aberto

/* Os TRÊS valores exatos aceitos por PATCH /api/trabalho/:id/aprovacao (APROVACAO_VALIDAS) */
var OPCOES_APROVACAO = [
  { valor:'Aprovado', classe:'aprovado', texto:'Aprovado' },
  { valor:'Refazer', classe:'refazer', texto:'Refazer' },
  { valor:'Em Andamento', classe:'andamento', texto:'Em Andamento' }
];

function formatarDataHora(iso){
  if(!iso) return '';
  try { return new Date(iso).toLocaleString('pt-BR'); } catch(e){ return String(iso); }
}

function seloDownload(idTrabalho){
  var baixadoEm = MAPA_DOWNLOADS_ATUAL[idTrabalho];
  if(baixadoEm){
    return '<span class="selo-download baixado" title="Baixado em '+esc(formatarDataHora(baixadoEm))+'">'
      + '<i class="ti ti-check" aria-hidden="true"></i>Baixado</span>';
  }
  return '<span class="selo-download nao-baixado">Não baixado</span>';
}

function renderTrabalhos(trabalhos){
  var lista = document.getElementById('listaTrabalhos');
  if(trabalhos.length === 0){
    lista.innerHTML = '<div class="msg-vazio">Nenhum trabalho encontrado.</div>';
    return;
  }
  lista.innerHTML = trabalhos.map(function(t){
    var osTxto = t.os ? (t.os + (t.os_extra ? ' +'+t.os_extra : '')) : 'Sem OS';
    var botoes = OPCOES_APROVACAO.map(function(op){
      var ativo = (t.aprovacao === op.valor) ? ' ativo' : '';
      return '<button class="btn-aprovacao '+op.classe+ativo+'" data-id="'+esc(t.id)+'" data-valor="'+esc(op.valor)+'">'+esc(op.texto)+'</button>';
    }).join('');
    return '<div class="trabalho" data-id="'+esc(t.id)+'">'
      + '<div class="cab-trabalho">'
        + '<div class="info">'
          + '<div class="id-trabalho">'+esc(t.id_trabalho || '(sem ID)')+'</div>'
          + '<div class="os">'+esc(osTxto)+'</div>'
        + '</div>'
        + '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">'
          + seloDownload(t.id)
          + badgeAprovacao(t.aprovacao)
        + '</div>'
      + '</div>'
      + '<div class="acoes-aprovacao">'+botoes+'</div>'
      + '</div>';
  }).join('');
}

/* ---- Toast simples de feedback ---- */
var _toastTimer = null;
function mostrarToast(msg, ehErro){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('erro', !!ehErro);
  el.classList.add('ver');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ el.classList.remove('ver'); }, 3000);
}

/* ---- Clique nos botões Aprovado/Refazer/Em Andamento (delegação de evento) ---- */
document.getElementById('listaTrabalhos').addEventListener('click', function(e){
  var btn = e.target.closest('.btn-aprovacao');
  if(!btn) return;
  definirAprovacao(btn.getAttribute('data-id'), btn.getAttribute('data-valor'));
});

async function definirAprovacao(idTrabalho, valor){
  var grupo = document.querySelectorAll('.trabalho[data-id="'+CSS.escape(idTrabalho)+'"] .btn-aprovacao');
  grupo.forEach(function(b){ b.setAttribute('disabled', 'disabled'); });
  try {
    var resp = await fetch('/api/trabalho/' + encodeURIComponent(idTrabalho) + '/aprovacao', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + pegarToken() },
      body: JSON.stringify({ valor: valor })
    });
    if(resp.status === 401 || resp.status === 403){ window.location.href = 'login.html'; return; }
    var dados = await resp.json();
    if(!dados.sucesso) throw new Error(dados.erro || 'Falha ao atualizar aprovação.');

    var alvo = TRABALHOS_ATUAIS.find(function(t){ return t.id === idTrabalho; });
    if(alvo) alvo.aprovacao = valor;
    document.getElementById('buscaTrabalhos').dispatchEvent(new Event('input'));
    mostrarToast(dados.mensagem || 'Status atualizado.');
  } catch(e){
    mostrarToast(e.message || 'Não foi possível atualizar o status.', true);
    grupo.forEach(function(b){ b.removeAttribute('disabled'); });
  }
}

async function carregarMapaDownloadsDoCliente(cnpj){
  MAPA_DOWNLOADS_ATUAL = {};
  if(!cnpj) return;
  try {
    var resp = await fetch('/api/diretor/downloads', { headers: { 'Authorization': 'Bearer ' + pegarToken() } });
    if(!resp.ok) return; // selo so' nao aparece; nao trava a tela de trabalhos
    var dados = await resp.json();
    if(!dados.sucesso) return;
    (dados.downloads || []).forEach(function(d){
      if(d.cnpj === cnpj) MAPA_DOWNLOADS_ATUAL[d.record_id] = d.baixado_em;
    });
  } catch(e){ /* selo fica "Não baixado" por padrão; nao e' critico */ }
}

async function abrirTrabalhosCliente(idCliente, nomeCliente, cnpjCliente){
  document.getElementById('visaoClientes').style.display = 'none';
  document.getElementById('visaoTrabalhos').style.display = '';
  document.getElementById('nomeClienteAtual').textContent = nomeCliente || '';
  document.getElementById('buscaTrabalhos').value = '';
  CNPJ_ATUAL = cnpjCliente || null;
  var lista = document.getElementById('listaTrabalhos');
  lista.innerHTML = '<div class="msg-vazio">Carregando trabalhos...</div>';

  try {
    var resp = await fetch('/api/diretor/trabalhos/' + encodeURIComponent(idCliente) + '?modo=todos', {
      headers: { 'Authorization': 'Bearer ' + pegarToken() }
    });
    if(resp.status === 401 || resp.status === 403){ window.location.href = 'login.html'; return; }
    var dados = await resp.json();
    if(!dados.sucesso) throw new Error(dados.erro || 'Falha ao carregar trabalhos');
    TRABALHOS_ATUAIS = dados.trabalhos || [];
    await carregarMapaDownloadsDoCliente(CNPJ_ATUAL);
    renderTrabalhos(TRABALHOS_ATUAIS);
  } catch(e){
    lista.innerHTML = '<div class="msg-vazio">Não foi possível carregar os trabalhos deste cliente.</div>';
  }
}

document.getElementById('buscaTrabalhos').addEventListener('input', function(){
  var termo = normalizar(this.value);
  if(!termo){ renderTrabalhos(TRABALHOS_ATUAIS); return; }
  renderTrabalhos(TRABALHOS_ATUAIS.filter(function(t){
    var alvo = normalizar((t.id_trabalho||'') + ' ' + (t.os||'') + ' ' + (t.aprovacao||''));
    return alvo.indexOf(termo) !== -1;
  }));
});

document.getElementById('btnVoltarClientes').addEventListener('click', function(){
  document.getElementById('visaoTrabalhos').style.display = 'none';
  document.getElementById('visaoClientes').style.display = '';
});

/* =========================================================================
   ABAS: Clientes / Downloads
   ========================================================================= */
function mostrarAba(nome){
  document.getElementById('abaClientes').classList.toggle('ativa', nome === 'clientes');
  document.getElementById('abaDownloads').classList.toggle('ativa', nome === 'downloads');
  document.getElementById('visaoClientes').style.display = (nome === 'clientes') ? '' : 'none';
  document.getElementById('visaoTrabalhos').style.display = 'none';
  document.getElementById('visaoDownloads').style.display = (nome === 'downloads') ? '' : 'none';
  if(nome === 'downloads') carregarDownloads();
}
document.getElementById('abaClientes').addEventListener('click', function(){ mostrarAba('clientes'); });
document.getElementById('abaDownloads').addEventListener('click', function(){ mostrarAba('downloads'); });

/* =========================================================================
   VISÃO 3: histórico completo de downloads (GET /api/diretor/downloads)
   ========================================================================= */
var TODOS_DOWNLOADS = []; // cache em memória: a busca filtra local, sem refetch

function renderDownloads(downloads){
  var lista = document.getElementById('listaDownloads');
  var contagem = document.getElementById('contagemDownloads');
  contagem.textContent = downloads.length + ' download' + (downloads.length === 1 ? '' : 's');
  if(downloads.length === 0){
    lista.innerHTML = '<div class="msg-vazio">Nenhum download registrado ainda.</div>';
    return;
  }
  lista.innerHTML = downloads.map(function(d){
    var osTxto = d.os ? '<span class="dl-os">'+esc(d.os)+'</span>' : '';
    var idTxto = esc(d.id_trabalho || d.record_id);
    return '<div class="download-row">'
      + '<div class="dl-empresa"><span class="chip-empresa"><i class="ti ti-building" aria-hidden="true"></i>'+esc(d.empresa || d.cnpj || '(empresa não identificada)')+'</span></div>'
      + '<div class="dl-relatorio">'+osTxto+idTxto+'</div>'
      + '<div class="dl-data">'+esc(formatarDataHora(d.baixado_em))+'</div>'
      + '</div>';
  }).join('');
  aplicarIcones(lista);
}

async function carregarDownloads(){
  var lista = document.getElementById('listaDownloads');
  var contagem = document.getElementById('contagemDownloads');
  lista.innerHTML = '<div class="msg-vazio">Carregando downloads...</div>';
  contagem.textContent = '';
  try {
    var resp = await fetch('/api/diretor/downloads', { headers: { 'Authorization': 'Bearer ' + pegarToken() } });
    if(resp.status === 401 || resp.status === 403){ window.location.href = 'login.html'; return; }
    var dados = await resp.json();
    if(!dados.sucesso) throw new Error(dados.erro || 'Falha ao carregar downloads');
    TODOS_DOWNLOADS = dados.downloads || []; // ja' vem ordenado (mais recente primeiro) do servidor
    renderDownloads(TODOS_DOWNLOADS);
  } catch(e){
    lista.innerHTML = '<div class="msg-vazio">Não foi possível carregar o histórico de downloads.</div>';
  }
}

document.getElementById('buscaDownloads').addEventListener('input', function(){
  var termo = normalizar(this.value);
  if(!termo){ renderDownloads(TODOS_DOWNLOADS); return; }
  renderDownloads(TODOS_DOWNLOADS.filter(function(d){
    var alvo = normalizar((d.empresa||'') + ' ' + (d.os||''));
    return alvo.indexOf(termo) !== -1;
  }));
});
</script>
