<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Diretor — ITR Engenharia</title>
<link rel="icon" href="IMG/logo.png">
<!-- Ícones: SVG inline (sem dependência de rede/CDN). Convertidos no carregamento. -->


<link rel="stylesheet" href="assets/css/original-painel.css">
</head>
<body>
<canvas id="campo" aria-hidden="true"></canvas>
<div id="vinheta" aria-hidden="true"></div>

<div class="conteudo">

  <!-- Cabeçalho -->
  <header class="topo">
    <span class="logo-link" aria-label="ITR Engenharia">
      <img src="IMG/logo.png" alt="ITR Engenharia">
    </span>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn-tema" id="btnTema" aria-label="Alternar tema claro ou escuro" title="Alternar tema">
        <svg id="iconeTema" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M3 12h1M20 12h1M12 3v1M12 20v1M5.6 5.6l.7 .7M17.7 17.7l.7 .7M18.4 5.6l-.7 .7M6.3 17.7l-.7 .7"/></svg>
      </button>
      <button class="btn-sair" id="btnSair">Sair <i class="ti ti-logout" aria-hidden="true"></i></button>
    </div>
  </header>

  <div class="titulo-painel">
    <h1>Painel do Diretor</h1>
    <div class="sub">Clientes, trabalhos e downloads em um só lugar.</div>
  </div>

  <!-- Conteúdo do painel -->
  <div id="conteudoPainel">
    <div class="guard" id="guard">
      <i class="ti ti-loader-2" aria-hidden="true"></i>
      <span>Verificando sessão...</span>
    </div>

    <!-- Abas: Clientes / Downloads -->
    <nav class="abas-painel" id="abasPainel" style="display:none">
      <button class="aba-painel ativa" id="abaClientes" data-aba="clientes"><i class="ti ti-building" aria-hidden="true"></i>Clientes</button>
      <button class="aba-painel" id="abaDownloads" data-aba="downloads"><i class="ti ti-download" aria-hidden="true"></i>Downloads</button>
    </nav>

    <!-- Visão 1: bolhas de clientes -->
    <div id="visaoClientes" style="display:none">
      <div class="busca">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="buscaClientes" placeholder="Buscar cliente..." aria-label="Buscar cliente">
      </div>
      <div class="contagem-clientes" id="contagemClientes"></div>
      <div class="bolhas" id="bolhas"></div>
    </div>

    <!-- Visão 2: trabalhos do cliente selecionado -->
    <div id="visaoTrabalhos" style="display:none">
      <div class="barra-cliente">
        <button class="btn-voltar" id="btnVoltarClientes"><i class="ti ti-arrow-left" aria-hidden="true"></i>Clientes</button>
        <span class="nome-cliente-atual" id="nomeClienteAtual"></span>
      </div>
      <div class="busca">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="buscaTrabalhos" placeholder="Buscar por ID do trabalho, OS ou status..." aria-label="Buscar trabalho">
      </div>
      <div class="lista-trabalhos" id="listaTrabalhos"></div>
    </div>

    <!-- Visão 3: histórico completo de downloads -->
    <div id="visaoDownloads" style="display:none">
      <div class="busca">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="buscaDownloads" placeholder="Buscar por empresa ou OS..." aria-label="Buscar download">
      </div>
      <div class="contagem-downloads" id="contagemDownloads"></div>
      <div class="lista-downloads" id="listaDownloads"></div>
    </div>
  </div>

</div>

<div id="toast" role="status" aria-live="polite"></div>


<script src="assets/js/common.js" defer></script>
<script src="assets/js/painel.js" defer></script>
</body>
</html>
