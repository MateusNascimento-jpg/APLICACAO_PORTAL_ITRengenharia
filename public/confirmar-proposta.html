<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <title>Confirmar proposta — ITR Engenharia</title>
        <link rel="stylesheet" href="/assets/css/proposal-confirm.css" />
        <script src="/assets/js/proposal-confirm.js" defer></script>
    </head>
    <body>
        <main class="confirm-card">
            <header><img src="/IMG/logo-comercial.png" width="200" alt="ITR Engenharia" /></header>
            <section>
                <p class="eyebrow">PROPOSTA COMERCIAL</p>
                <h1>Confirmação de aceite</h1>
                <p id="message" role="status">Para novos aceites, solicite e confirme o código na aba Propostas do Portal do Cliente.</p>
                <dl id="summary" hidden></dl>
                <form id="codeForm" hidden>
                    <label for="code">Código de confirmação</label>
                    <input
                        id="code"
                        name="code"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]{8}"
                        minlength="8"
                        maxlength="8"
                        autocomplete="one-time-code"
                        required
                    />
                    <p id="expiry" class="hint"></p>
                    <button type="submit">Validar código</button>
                </form>
                <form id="confirmForm" hidden>
                    <label class="consent"
                        ><input id="consent" type="checkbox" required /><span
                            >Li a proposta indicada acima e concordo expressamente com suas
                            condições comerciais.</span
                        ></label
                    >
                    <button type="submit">Confirmar aceite da proposta</button>
                </form>
                <p class="back"><a href="/login.html">Portal do Cliente</a></p>
            </section>
        </main>
    </body>
</html>
